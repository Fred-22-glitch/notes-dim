name: Tenho uma sugestão
description: Uma ideia para deixar o Notes Dim melhor
labels: ["sugestão"]
body:
  - type: textarea
    id: ideia
    attributes:
      label: Qual é a ideia?
    validations: {required: true}
  - type: textarea
    id: porque
    attributes:
      label: Como ela ajudaria nos seus estudos?
  - type: dropdown
    id: onde
    attributes:
      label: Para qual versão?
      options: [PC e celular, Só PC, Só celular]
